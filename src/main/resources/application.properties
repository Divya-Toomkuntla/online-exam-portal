spring.application.name=online-exam-portal

# DEFAULT = local development with an in-memory H2 database (no MySQL needed).
# Data disappears when you stop the app. That is fine for learning.
spring.datasource.url=jdbc:h2:mem:examdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Lets you look at the tables in the browser: http://localhost:8080/h2-console
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT login tokens. The secret below is for local testing ONLY (needs 32+ characters).
# In production we set a real secret through the JWT_SECRET environment variable.
jwt.secret=${JWT_SECRET:local-dev-secret-key-change-me-12345678}
# Token valid for 24 hours
jwt.expiration-ms=86400000

# Show our error messages (like "Wrong email or password") in API responses
server.error.include-message=always

# Hosting platforms (Render, Railway) provide PORT
server.port=${PORT:8080}
