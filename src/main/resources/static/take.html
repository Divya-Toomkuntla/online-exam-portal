<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exam - Online Exam Portal</title>
  <style>
    :root { --accent:#2563eb; --line:#e5e7eb; --muted:#6b7280; }
    body { font-family: system-ui, sans-serif; background:#f5f6fa; color:#1f2430; margin:0; }
    header { background:var(--accent); color:#fff; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; gap:10px; position:sticky; top:0; z-index:5; }
    header h1 { margin:0; font-size:1.1rem; }
    #timer { font-size:1.2rem; font-weight:700; font-variant-numeric:tabular-nums; background:#1e40af; padding:4px 12px; border-radius:6px; }
    #timer.low { background:#dc2626; }
    main { max-width:760px; margin:24px auto; padding:0 16px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:16px; }
    .opt { display:block; padding:8px 10px; border:1px solid var(--line); border-radius:6px; margin-top:6px; cursor:pointer; }
    .opt:hover { background:#f3f4f6; }
    button, a.btn { border:0; border-radius:6px; padding:10px 16px; font:inherit; cursor:pointer; background:var(--accent); color:#fff; text-decoration:none; display:inline-block; }
    button:disabled { opacity:.6; cursor:default; }
    .muted { color:var(--muted); }
    .error { color:#b91c1c; }
    .warn { background:#fef3c7; color:#92400e; border-radius:6px; padding:10px 12px; }
    .score { font-size:2rem; font-weight:700; margin:0; }
    .review { border-left:5px solid var(--line); }
    .review.right { border-left-color:#16a34a; }
    .review.wrong { border-left-color:#dc2626; }
    .review li { margin:3px 0; }
    .tick { color:#166534; font-weight:600; }
    .cross { color:#b91c1c; font-weight:600; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Loading exam...</h1>
    <div id="timer" hidden>00:00</div>
  </header>

  <main>
    <p id="message" class="error"></p>
    <p id="backLink" hidden><a class="btn" href="/dashboard.html">Back to exams</a></p>

    <!-- The exam paper -->
    <section id="paper" hidden>
      <div class="card">
        <p id="description" class="muted" style="margin:0"></p>
        <p class="muted" style="margin:8px 0 0">You have one attempt. The questions and options are in a random order for each student.</p>
      </div>
      <div id="questions"></div>
      <button type="button" id="submitBtn">Submit exam</button>
    </section>

    <!-- The result, shown after submitting -->
    <section id="resultBox" hidden>
      <div class="card">
        <p class="muted" style="margin:0">Your score</p>
        <p class="score" id="scoreText"></p>
        <p id="percentText" class="muted"></p>
        <p id="note" class="warn" hidden></p>
        <a class="btn" href="/dashboard.html">Back to exams</a>
        <a class="btn" href="/results.html" style="background:#475569">My results</a>
      </div>
      <h3>Review</h3>
      <div id="review"></div>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const examId = new URLSearchParams(window.location.search).get('id');
    let exam = null;
    let submitted = false;
    let endTime = 0;
    let timerId = null;

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function getToken() {
      try { return localStorage.getItem('token'); } catch (e) { return null; }
    }

    function logout() {
      try { localStorage.removeItem('token'); localStorage.removeItem('user'); } catch (e) {}
      window.location.href = '/login.html';
    }

    async function api(path, options = {}) {
      const res = await fetch(path, {
        ...options,
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + getToken() }
      });
      if (res.status === 401) { logout(); throw new Error('Session expired'); }
      return res;
    }

    async function readError(res) {
      const data = await res.json().catch(() => ({}));
      return data.message || Object.values(data).join(', ') || 'Something went wrong';
    }

    function renderPaper() {
      $('title').textContent = exam.title;
      $('description').textContent = exam.description || 'Answer all questions and click Submit exam.';
      $('questions').innerHTML = exam.questions.map((q, i) => `
        <div class="card">
          <p><b>${i + 1}. ${esc(q.questionText)}</b>
             <span class="muted">(${q.marks} mark${q.marks > 1 ? 's' : ''})</span></p>
          ${q.options.map(o => `
            <label class="opt">
              <input type="radio" name="q_${q.id}" value="${esc(o.key)}">
              ${esc(o.text)}
            </label>`).join('')}
        </div>`).join('');
      $('paper').hidden = false;
    }

    function collectAnswers() {
      const answers = {};
      exam.questions.forEach(q => {
        const checked = document.querySelector('input[name="q_' + q.id + '"]:checked');
        if (checked) answers[q.id] = checked.value;
      });
      return answers;
    }

    // ----- Timer: counts down to the end time, and submits by itself at zero -----
    // The server tells us how many seconds are left, so refreshing the page does not give extra time.
    function startTimer() {
      endTime = Date.now() + exam.remainingSeconds * 1000;
      $('timer').hidden = false;
      tick();
      timerId = setInterval(tick, 1000);
    }

    function tick() {
      const left = Math.max(0, Math.round((endTime - Date.now()) / 1000));
      const mm = String(Math.floor(left / 60)).padStart(2, '0');
      const ss = String(left % 60).padStart(2, '0');
      $('timer').textContent = mm + ':' + ss;
      $('timer').classList.toggle('low', left <= 60);
      if (left === 0) {
        clearInterval(timerId);
        submitExam(true);
      }
    }

    // ----- Submit -----
    async function submitExam(auto) {
      if (submitted) return;

      const answers = collectAnswers();
      const unanswered = exam.questions.length - Object.keys(answers).length;
      if (!auto && unanswered > 0 &&
          !confirm('You have ' + unanswered + ' unanswered question(s). Submit anyway?')) {
        return;
      }

      submitted = true;
      clearInterval(timerId);
      $('submitBtn').disabled = true;
      $('message').textContent = auto ? 'Time is up. Submitting your answers...' : '';

      const res = await api('/api/exams/' + examId + '/submit', {
        method: 'POST',
        body: JSON.stringify({ answers })
      });

      if (!res.ok) {
        submitted = false;
        $('submitBtn').disabled = false;
        $('message').textContent = await readError(res);
        return;
      }
      showResult(await res.json());
    }

    function showResult(result) {
      $('paper').hidden = true;
      $('timer').hidden = true;
      $('message').textContent = '';

      const percent = result.totalMarks > 0 ? Math.round(result.score * 100 / result.totalMarks) : 0;
      $('scoreText').textContent = result.score + ' / ' + result.totalMarks;
      $('percentText').textContent = percent + '%';

      if (result.note) {
        $('note').textContent = result.note;
        $('note').hidden = false;
      }

      $('review').innerHTML = result.review.map((q, i) => `
        <div class="card review ${q.correct ? 'right' : 'wrong'}">
          <p><b>${i + 1}. ${esc(q.questionText)}</b>
             <span class="${q.correct ? 'tick' : 'cross'}">${q.correct ? 'Correct' : 'Wrong'}</span></p>
          <ul>
            ${q.options.map(o => `
              <li>
                ${esc(o.text)}
                ${o.key === q.correctOption ? '<span class="tick"> (correct answer)</span>' : ''}
                ${o.key === q.yourAnswer && !q.correct ? '<span class="cross"> (your answer)</span>' : ''}
                ${o.key === q.yourAnswer && q.correct ? '<span class="tick"> (your answer)</span>' : ''}
              </li>`).join('')}
          </ul>
          ${q.yourAnswer ? '' : '<p class="muted">You did not answer this question.</p>'}
        </div>`).join('');

      $('resultBox').hidden = false;
      window.scrollTo({ top: 0 });
    }

    // Warn before leaving the page in the middle of an exam
    window.addEventListener('beforeunload', e => {
      if (exam && !submitted) { e.preventDefault(); e.returnValue = ''; }
    });

    $('submitBtn').addEventListener('click', () => submitExam(false));

    (async function init() {
      if (!getToken()) { window.location.href = '/login.html'; return; }
      if (!examId) { $('message').textContent = 'No exam selected.'; $('backLink').hidden = false; return; }

      // Starts the attempt, or resumes it if the student already started
      const res = await api('/api/exams/' + examId + '/start', { method: 'POST' });
      if (!res.ok) {
        $('title').textContent = 'Exam';
        $('message').textContent = await readError(res);
        $('backLink').hidden = false;
        return;
      }

      exam = await res.json();
      renderPaper();
      startTimer();
    })();
  </script>
</body>
</html>
