# Used only when running with the "prod" profile (on the hosting platform).
# Set SPRING_PROFILES_ACTIVE=prod and these three variables there.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# A long random text, at least 32 characters, set on the hosting platform
jwt.secret=${JWT_SECRET}

# No test admin with a known password in production
app.seed-test-admin=false

# The first admin account is created from these two variables (see AdminBootstrap)
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
